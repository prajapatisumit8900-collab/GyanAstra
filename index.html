<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="GyanAstra - Smart Learning Platform"
    >

    <meta name="theme-color" content="#0f172a">

    <title>GyanAstra Drive | SumitStudyIQ</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- Welcome Screen -->
    <main id="welcomeScreen">

        <h1 class="main-title">
            GyanAstra Drive (ज्ञानअस्त्र)
        </h1>

        <h2 class="sub-title">
            By SUMITSTUDYIQ
        </h2>

        <p class="tag-line">
            Aapka Smart Offline AI Teacher aur Selection ka Hathiyar!
        </p>

        <button
            type="button"
            class="btn-start"
            id="startLearningBtn"
        >
            ▶ Start Learning
        </button>

    </main>


    <!-- Loading Screen -->
    <section
        id="loadingScreen"
        aria-live="polite"
        aria-label="Loading GyanAstra"
    >

        <div
            class="logo-icon"
            aria-hidden="true"
        >
            🚀
        </div>

        <h1 class="app-title">
            GyanAstra
        </h1>

        <p class="loading-subtitle">
            Your Learning Platform
        </p>

        <div class="loading-box">

            <div
                class="loading-bar"
                id="rocketBar"
            ></div>

        </div>

        <div
            class="loading-text"
            id="statusText"
        >
            Initializing GyanAstra...
        </div>

    </section>


    <script src="./assets/js/app.js"></script>

</body>
</html>
