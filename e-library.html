<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Library | GyanAstra Drive</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 { color: #ff9800; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; }
        
        .book-list {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .book-item {
            background: #1e293b;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }
        .book-info h4 { margin: 0 0 5px 0; color: white; font-size: 18px; }
        .book-info span { font-size: 13px; color: #94a3b8; }
        .btn-download {
            background: #ff9800;
            color: #111;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-download:hover { background: #e68a00; }

        @media screen and (max-width: 600px) {
            .book-item { flex-direction: column; align-items: flex-start; gap: 10px; }
            .btn-download { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <h1>GyanAstra E-Library</h1>
    <p class="subtitle">Secure offline documents and books</p>

    <div class="book-list">
        <div class="book-item">
            <div class="book-info">
                <h4>Indian Polity Complete Notes</h4>
                <span>PDF • 15 MB</span>
            </div>
            <button class="btn-download" onclick="alert('Opening Document...')">Read / Open</button>
        </div>
        <div class="book-item">
            <div class="book-info">
                <h4>Modern History Quick Revision</h4>
                <span>PDF • 10 MB</span>
            </div>
            <button class="btn-download" onclick="alert('Opening Document...')">Read / Open</button>
        </div>
    </div>
</body>
</html>
