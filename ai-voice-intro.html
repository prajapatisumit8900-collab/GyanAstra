<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GyanAstra - Premium UI & Working AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #f7f9fa; color: #3c3c3c; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        .screen { display: none; flex-direction: column; height: 100vh; width: 100%; max-width: 500px; margin: 0 auto; position: relative; background: #ffffff; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .screen.active { display: flex; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        /* Top Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #fff; border-bottom: 2px solid #e5e5e5; z-index: 10; }
        .lang-select { background: #f0f0f0; padding: 5px 12px; border-radius: 12px; font-weight: 800; font-size: 14px; }
        .stats-right { display: flex; gap: 15px; font-weight: 800; font-size: 16px; align-items: center; }
        .stat-icon { display: inline-flex; align-items: center; gap: 4px; }

        .dash-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; background: #f2fbfd; }

        /* Module Header */
        .module-header {
            background: linear-gradient(135deg, #ff9a44, #fc6076);
            border-radius: 20px; padding: 25px 20px; color: white; margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(252, 96, 118, 0.2); cursor: pointer;
        }
        .module-subtitle { font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        .module-title { font-size: 22px; font-weight: 900; line-height: 1.2; }
        .module-hindi { font-size: 14px; opacity: 0.9; margin-top: 4px; }

        /* Vertical Path */
        .path-container { position: relative; margin-left: 20px; padding-bottom: 20px; }
        .path-line { position: absolute; left: 32px; top: 0; bottom: 0; width: 4px; background: #fca5a5; z-index: 1; }
        
        .path-node { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; position: relative; z-index: 2; cursor: pointer; }
        .node-icon-wrapper { position: relative; width: 68px; height: 68px; border-radius: 50%; background: white; border: 4px solid #ff9a44; display: grid; place-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .node-icon { font-size: 30px; }
        .node-check { position: absolute; bottom: -4px; right: -4px; background: #22c55e; color: white; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; border: 2px solid white; }
        
        .node-card { background: white; flex: 1; padding: 15px 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); border: 2px solid transparent; }
        .path-node.active .node-card { border-color: #ff9a44; }
        .node-title { font-size: 18px; font-weight: 800; color: #1f2937; }
        .node-subtitle { font-size: 13px; color: #6b7280; font-weight: 600; }

        /* Grid Categories */
        .section-title { text-align: center; font-size: 20px; font-weight: 900; color: #1f2937; margin: 40px 0 20px; }
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-item { background: white; border-radius: 20px; padding: 25px 15px; text-align: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.03); transition: 0.2s; }
        .grid-item:active { transform: translateY(4px); }
        .grid-icon { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; font-size: 30px; margin: 0 auto 15px; color: white; }
        .grid-title { font-size: 15px; font-weight: 800; color: #374151; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 500px; margin: 0 auto; background: white; border-top: 2px solid #e5e5e5; display: flex; justify-content: space-around; padding: 12px 10px 25px; z-index: 100; }
        .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #9ca3af; font-weight: 800; font-size: 12px; cursor: pointer; }
        .nav-btn i { font-size: 24px; font-style: normal; }
        .nav-btn.active { color: #f97316; }

        /* AI Chat Screen */
        .ai-chat-screen { background: #f0fdf4; flex: 1; display: flex; flex-direction: column; }
        .ai-chat-header { background: #22c55e; color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; font-size: 20px; font-weight: 800; }
        .btn-close { background: none; border: none; color: white; font-size: 28px; cursor: pointer; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-bottom: 120px; }
        .msg { max-width: 80%; padding: 15px; border-radius: 16px; font-size: 16px; font-weight: 700; line-height: 1.4; }
        .msg-ai { background: white; border: 2px solid #e5e5e5; align-self: flex-start; color: #374151; }
        .msg-user { background: #22c55e; color: white; align-self: flex-end; }
        .ai-mic-area { position: fixed; bottom: 0; left: 0; right: 0; max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-top: 2px solid #e5e5e5; text-align: center; z-index: 100; }
        .btn-mic-large { width: 70px; height: 70px; border-radius: 50%; background: #1cb0f6; border: none; border-bottom: 6px solid #1899d6; color: white; font-size: 28px; cursor: pointer; display: grid; place-items: center; margin: 0 auto; }
    </style>
</head>
<body>

    <!-- SCREEN 1: DASHBOARD -->
    <div id="screen-dashboard" class="screen active">
        <div class="top-bar">
            <div class="lang-select">हि ⌄ Level 1</div>
            <div class="stats-right">
                <div class="stat-icon">🔮 <span>646</span></div>
                <div class="stat-icon">🪙 <span>204</span></div>
            </div>
        </div>

        <div class="dash-content">
            <div class="module-header" onclick="openAIChat()">
                <div class="module-subtitle">MODULE 1 | TOPIC 1</div>
                <div class="module-title">Everyday Life : Daily English</div>
                <div class="module-hindi">रोज़ की अंग्रेज़ी (AI Tutor से बात करें)</div>
            </div>

            <div class="section-title">SPEAK WITHOUT LIMITS</div>
            <p style="text-align: center; color: #6b7280; margin-bottom: 20px; font-weight: 700;">Browse all features</p>
            
            <div class="grid-menu">
                <div class="grid-item" onclick="openAIChat()">
                    <div class="grid-icon" style="background:#3b82f6;">🤖</div><div class="grid-title">AI Chatbot</div>
                </div>
                <div class="grid-item" onclick="openAIChat()">
                    <div class="grid-icon" style="background:#4f46e5;">🗣️</div><div class="grid-title">Voice Tutor</div>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn active" onclick="switchScreen('screen-dashboard')"><i>🏠</i>Home</button>
            <button class="nav-btn" onclick="openAIChat()"><i>📞</i>AI Call</button>
        </div>
    </div>

    <!-- SCREEN 2: AI CHAT SCREEN -->
    <div id="screen-ai" class="screen">
        <div class="ai-chat-screen">
            <div class="ai-chat-header">
                <button class="btn-close" onclick="switchScreen('screen-dashboard')">←</button>
                <span>GyanAstra AI Tutor</span>
            </div>
            
            <div class="chat-box" id="chat-history">
                <div class="msg msg-ai">🤖 Hello! I am your AI English Teacher. Type or use mic to chat with me!</div>
            </div>

            <div class="ai-mic-area">
                <p id="ai-mic-status" style="color:#6b7280; font-weight:800; margin-bottom:8px;">TAP MIC TO TALK</p>
                <button class="btn-mic-large" id="ai-mic-btn" onclick="toggleAIChatMic()">🎙️</button>
            </div>
        </div>
    </div>

    <script>
        const GEMINI_API_KEY = "YAHAN_APNI_API_KEY_PASTE_KAREIN"; // अपनी असली API Key यहाँ डालें

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.speechSynthesis.cancel();
        }

        function openAIChat() {
            switchScreen('screen-ai');
        }

        let aiSR;
        function toggleAIChatMic() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SR) return alert("Speech Recognition not supported in this browser!");

            if(!aiSR) {
                aiSR = new SR();
                aiSR.lang = 'en-US';
                aiSR.onresult = async (e) => {
                    let text = e.results[0][0].transcript;
                    document.getElementById('ai-mic-status').innerText = "TAP MIC TO TALK";
                    
                    appendChat('user', text);
                    let reply = await callGeminiAI(text);
                    appendChat('ai', reply);
                    speakText(reply);
                };
            }

            aiSR.start();
            document.getElementById('ai-mic-status').innerText = "Listening...";
        }

        async function callGeminiAI(userText) {
            if(GEMINI_API_KEY === "AQ.Ab8RN6LLgQaccWuoSsG8DrJxWIK_r0XpP1QpxhNT62pm4FbwvA" || GEMINI_API_KEY === "") {
                return "Please put your Gemini API key in the code first.";
            }

            const prompt = `You are a friendly Spoken English Teacher. The user said: "${userText}". Keep your reply under 2 sentences, correct grammar if wrong, and encourage them.`;
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                return data.candidates[0].content.parts[0].text;
            } catch(e) {
                return "Network error. Please check your internet connection.";
            }
        }

        function appendChat(role, text) {
            const box = document.getElementById('chat-history');
            let div = document.createElement('div');
            div.className = `msg msg-${role}`;
            div.innerText = (role === 'ai' ? '🤖 ' : '') + text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function speakText(text) {
            if('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-US'; u.rate = 0.9;
                window.speechSynthesis.speak(u);
            }
        }
    </script>
</body>
</html>
