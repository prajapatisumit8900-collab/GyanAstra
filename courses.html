<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="GyanAstra Courses">

    <title>Courses | GyanAstra</title>

    <link rel="stylesheet" href="./assets/css/courses.css">
</head>

<body>

<header class="topbar">

    <div class="top-left">

        <a href="./categories.html" class="back-btn">
            ←
        </a>

        <div class="brand">
            <span class="brand-icon">🚀</span>

            <div>
                <strong>GyanAstra</strong>
                <small>SUMITSTUDYIQ</small>
            </div>
        </div>

    </div>

    <div class="top-actions">

        <button id="notificationBtn">
            🔔
        </button>

        <div class="user-avatar" id="userAvatar">
            S
        </div>

    </div>

</header>


<main class="page">

    <!-- HERO -->

    <section class="hero">

        <div>

            <span class="eyebrow">
                LEARNING PATH
            </span>

            <h1 id="pageTitle">
                All Courses
            </h1>

            <p id="pageDescription">
                Apni preparation ke liye course choose karein.
            </p>

        </div>

        <div class="hero-icon">
            📚
        </div>

    </section>


    <!-- FILTER -->

    <section class="filter-area">

        <div class="search">

            <span>🔍</span>

            <input
                type="search"
                id="courseSearch"
                placeholder="Search courses..."
            >

        </div>


        <select id="levelFilter">

            <option value="all">
                All Levels
            </option>

            <option value="beginner">
                Beginner
            </option>

            <option value="intermediate">
                Intermediate
            </option>

            <option value="advanced">
                Advanced
            </option>

        </select>


        <select id="typeFilter">

            <option value="all">
                All Courses
            </option>

            <option value="free">
                Free
            </option>

            <option value="premium">
                Premium
            </option>

        </select>

    </section>


    <!-- COURSE COUNT -->

    <div class="course-heading">

        <div>

            <span class="section-label">
                COURSES
            </span>

            <h2>
                Available Courses
            </h2>

        </div>

        <span id="courseCount">
            0 Courses
        </span>

    </div>


    <!-- COURSE GRID -->

    <section
        class="course-grid"
        id="courseGrid"
    ></section>


    <!-- LOADING -->

    <div
        class="loading"
        id="loading"
    >
        <div class="spinner"></div>

        <p>
            Courses loading...
        </p>
    </div>


    <!-- EMPTY -->

    <div
        class="empty hidden"
        id="emptyState"
    >

        <div>
            🔍
        </div>

        <h3>
            Course नहीं मिला
        </h3>

        <p>
            Search या filter बदलकर फिर कोशिश करें।
        </p>

    </div>


</main>


<script src="./assets/js/courses.js"></script>

</body>
</html>
